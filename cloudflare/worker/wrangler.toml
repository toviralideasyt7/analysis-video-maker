# Control plane: password-gated API in front of the render pipeline.
#
#   wrangler d1 create avm                      -> paste the id below
#   wrangler kv namespace create SESSIONS       -> paste the id below
#   wrangler d1 execute avm --file=./schema.sql --remote
#   wrangler secret put GH_TOKEN
#   wrangler secret put HOOK_SECRET
#   wrangler secret put APP_PASSWORD            (optional; a default is coded in)
#   wrangler deploy

name = "avm-control"
main = "src/index.ts"
compatibility_date = "2024-11-01"
workers_dev = true

[[d1_databases]]
binding = "DB"
database_name = "avm"
database_id = "0371647f-942c-403d-9ac2-0d82498fd97b"

[[kv_namespaces]]
binding = "SESSIONS"
id = "6abbd87e08f34791acbbdf8ae6542d27"

[vars]
GITHUB_OWNER = "toviralideasyt7"
GITHUB_REPO = "analysis-video-maker"
GITHUB_BRANCH = "main"
RESEARCH_WORKFLOW = "research.yml"
# Set to the Pages origin once it exists to lock CORS down.
ALLOWED_ORIGIN = "*"