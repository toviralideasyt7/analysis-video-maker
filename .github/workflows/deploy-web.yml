name: deploy-studio

# Publishes the studio (a static page plus a same-origin API proxy function) to
# Cloudflare Pages. Nothing to build - no bundling step.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Repository variable: PAGES_PROJECT (defaults to race-video-studio).

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/pages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the studio to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Pin the CLI: the newest wrangler omitted the Pages Functions bundle when
          # deploying a directory that is not the repo root, which silently broke the
          # /api/* proxy in production. Observed: /api/login returned the static page.
          wranglerVersion: '3.114.17'
          # Run from inside the studio folder: wrangler resolves the Functions
          # bundle relative to the working directory, not the deploy target, so
          # deploying a subdirectory from the repo root silently drops it.
          workingDirectory: cloudflare/pages
          command: pages deploy . --project-name=${{ vars.PAGES_PROJECT || 'race-video-studio' }}
