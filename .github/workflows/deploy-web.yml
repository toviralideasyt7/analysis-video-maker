name: deploy-studio

# Publishes the studio (a static page plus a same-origin API proxy function) to
# Cloudflare Pages. Nothing to build - no bundling step.
#
# Repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Repository variable: PAGES_PROJECT (defaults to race-video-studio).

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/pages/**"
      - ".github/workflows/deploy-web.yml"
  workflow_dispatch:

concurrency:
  group: deploy-studio-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - name: Publish the studio to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy cloudflare/pages --project-name=${{ vars.PAGES_PROJECT || 'race-video-studio' }}