name: render-video

# The render layer. Dispatched by the backend only after a project is APPROVED.
on:
  workflow_dispatch:
    inputs:
      projectId:
        description: Project id (bundle is read from the approved artifact)
        required: true
      videoSpecVersion:
        description: VideoSpec version
        required: false
        default: "1"
      datasetVersion:
        description: Dataset version
        required: false
        default: "1"
      artifactBaseUrl:
        description: Optional base URL for the project bundle
        required: false
        default: ""
      renderScale:
        description: "1 = full quality, 0.5 = fast preview"
        required: false
        default: "1"
      skipAiQa:
        description: "true to skip the AI QA agent"
        required: false
        default: "false"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PROJECT_ID: ${{ inputs.projectId }}
      VIDEO_SPEC_VERSION: ${{ inputs.videoSpecVersion }}
      DATASET_VERSION: ${{ inputs.datasetVersion }}
      ARTIFACT_BASE_URL: ${{ inputs.artifactBaseUrl }}
      RENDER_SCALE: ${{ inputs.renderScale }}
      RENDER_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: npm ci

      - name: Build the Rust core
        run: cargo build --release --workspace

      - name: Locate the approved project bundle
        run: |
          set -euo pipefail
          mkdir -p projects
          if [ -n "${ARTIFACT_BASE_URL}" ]; then
            curl -fsSL "${ARTIFACT_BASE_URL%/}/${PROJECT_ID}.tar.gz" -o bundle.tar.gz
            tar -xzf bundle.tar.gz -C projects
          else
            # Fall back to a bundle committed under bundles/<projectId>/
            test -d "bundles/${PROJECT_ID}" || { echo "no bundle for ${PROJECT_ID}"; exit 1; }
            cp -r "bundles/${PROJECT_ID}" "projects/${PROJECT_ID}"
          fi
          ls -la "projects/${PROJECT_ID}"

      - name: Validate the VideoSpec against the shared schema
        run: npx tsx tools/validate-spec.ts "projects/${PROJECT_ID}"

      - name: Validate the dataset with the Rust core
        run: |
          set -euo pipefail
          ./target/release/datarace validate \
            --in "projects/${PROJECT_ID}/dataset.json" \
            --out "projects/${PROJECT_ID}/quality.ci.json" \
            --strict

      - name: Verify the frame tape matches the dataset
        run: npx tsx tools/verify-tape.ts "projects/${PROJECT_ID}"

      # The AI layer runs in CI too: the QA agent audits the approved bundle.
      - name: AI QA review
        if: ${{ inputs.skipAiQa != 'true' }}
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_BASE_URL: ${{ vars.NARA_BASE_URL || 'https://router.bynara.id/v1' }}
          GEMINI_WORKER_1: ${{ vars.GEMINI_WORKER_1 }}
          GEMINI_WORKER_2: ${{ vars.GEMINI_WORKER_2 }}
        run: npx tsx services/orchestrator/src/scripts/ai-qa.ts --project "projects/${PROJECT_ID}"

      # npm runs a workspace script with the workspace as cwd, so the project
      # path is passed absolute rather than relative to the repository root.
      - name: Render the video with Remotion
        run: |
          set -euo pipefail
          npm run render -w @avm/renderer -- \
            --project "${GITHUB_WORKSPACE}/projects/${PROJECT_ID}" \
            --out "${GITHUB_WORKSPACE}/projects/${PROJECT_ID}/renders/${PROJECT_ID}.mp4"

      - name: Render the thumbnail
        run: |
          set -euo pipefail
          npm run render -w @avm/renderer -- \
            --project "${GITHUB_WORKSPACE}/projects/${PROJECT_ID}" \
            --thumbnail-only \
            --out "${GITHUB_WORKSPACE}/projects/${PROJECT_ID}/renders/${PROJECT_ID}.mp4"

      # Background music: 5 copyright-free tracks from the channel's playlist
      # live in assets/music/ (committed, so no download/bot-block risk).
      # A random track is picked per render.
      - name: Pick random music track
        id: music
        run: |
          set -euo pipefail
          TRACK=$(ls "${GITHUB_WORKSPACE}/assets/music/"*.mp3 | shuf -n 1)
          echo "track=${TRACK}" >> "$GITHUB_OUTPUT"
          echo "picked: ${TRACK}"

      # The GitHub-hosted Ubuntu image does not ship ffmpeg, so install it only
      # when it is missing. The same binary is then used for the probe below.
      - name: Ensure ffmpeg is available
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq ffmpeg
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1

      - name: Post-process with ffmpeg
        run: |
          set -euo pipefail
          IN="projects/${PROJECT_ID}/renders/${PROJECT_ID}.mp4"
          OUT="projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4"
          ffmpeg -y -i "$IN" -c:v libx264 -preset medium -crf 20 -pix_fmt yuv420p -movflags +faststart -an "$OUT"

      # Mix the randomly picked background track under the video at low
      # volume, looping/trimming it to the video length.
      - name: Mix background music
        run: |
          set -euo pipefail
          IN="projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4"
          TRACK="${{ steps.music.outputs.track }}"
          if [ -n "$TRACK" ] && [ -f "$TRACK" ]; then
            DUR=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "$IN")
            ffmpeg -y -i "$IN" -stream_loop -1 -i "$TRACK" \
              -filter_complex "[1:a]volume=0.12,atrim=0:${DUR}[bg]" \
              -map 0:v -map "[bg]" -c:v copy -c:a aac -b:a 128k -shortest \
              -movflags +faststart "projects/${PROJECT_ID}/renders/${PROJECT_ID}-music.mp4"
            mv "projects/${PROJECT_ID}/renders/${PROJECT_ID}-music.mp4" "$IN"
            echo "mixed ${TRACK} into ${IN}"
          else
            echo "no music track available, keeping silent video"
          fi

      - name: Validate the rendered MP4
        run: |
          set -euo pipefail
          ./target/release/datarace probe \
            --in "projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4" \
            --expect-size 1280x720 \
            --out "projects/${PROJECT_ID}/renders/probe.json"

      # Fails the workflow on violations (exit 1) so a visually broken render
      # can never be published. Warnings are reported but never fail.
      - name: Video QA gate (bars, layout, transitions)
        run: |
          set -euo pipefail
          pip install --quiet opencv-python-headless numpy pillow
          python3 tools/video-qa/check-video.py \
            "projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4" \
            --frames "bundles/${PROJECT_ID}" \
            --out "projects/${PROJECT_ID}/renders/videoqa-report.json"

      - name: Generate YouTube metadata (AI title, description, tags)
        env:
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          NARA_BASE_URL: ${{ vars.NARA_BASE_URL || 'https://router.bynara.id/v1' }}
          GEMINI_WORKER_1: ${{ vars.GEMINI_WORKER_1 }}
          GEMINI_WORKER_2: ${{ vars.GEMINI_WORKER_2 }}
        run: |
          set -euo pipefail
          npx tsx services/orchestrator/src/scripts/generate-metadata.ts \
            --project "projects/${PROJECT_ID}" \
            --out "projects/${PROJECT_ID}/renders/metadata.json" || echo "metadata generation failed (non-fatal)"

      - name: Generate YouTube thumbnail
        run: |
          set -euo pipefail
          pip install --quiet pillow
          TITLE=$(python3 -c "import json;print(json.load(open('projects/${PROJECT_ID}/video-spec.json')).get('title','Data Race'))")
          YEARS=$(python3 -c "
          import json
          d=json.load(open('projects/${PROJECT_ID}/dataset.json'))
          ys=[p.get('year') for p in d.get('periods',[]) if isinstance(p,dict) and p.get('year')]
          print(f'{min(ys)} - {max(ys)}' if ys else '')")
          KICKER=$(python3 -c "import json;print(json.load(open('projects/${PROJECT_ID}/video-spec.json')).get('topic','').upper()[:60])")
          python3 tools/make-thumbnail.py \
            --video "projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4" \
            --title "$TITLE" --subtitle "$YEARS" --kicker "$KICKER" \
            --out "projects/${PROJECT_ID}/renders/${PROJECT_ID}-thumbnail.jpg" \
            || echo "thumbnail generation failed (non-fatal)"

      - name: Upload the render artifacts
        uses: actions/upload-artifact@v4
        with:
          name: render-${{ inputs.projectId }}
          path: |
            projects/${{ inputs.projectId }}/renders/*.mp4
            projects/${{ inputs.projectId }}/renders/*.jpg
            projects/${{ inputs.projectId }}/renders/metadata.json
            projects/${{ inputs.projectId }}/renders/probe.json
            projects/${{ inputs.projectId }}/renders/videoqa-report.json
          if-no-files-found: error
          retention-days: 14

      # Upload the final MP4 to a temporary file host and capture the direct
      # download URL. The studio plays this URL straight in the <video> tag —
      # no worker proxy in the streaming path, so watching costs zero worker
      # requests and is effectively unlimited. 0x0.st keeps files ~30+ days,
      # which is plenty since finished videos go to YouTube within days.
      - name: Publish MP4 to temporary file host
        id: temphost
        if: success()
        run: |
          set -uo pipefail
          MP4="projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4"
          URL=""
          if [ -f "$MP4" ]; then
            URL="$(curl -fsS --max-time 180 -F "file=@${MP4}" https://0x0.st 2>/dev/null || true)"
            if [ -z "$URL" ]; then
              echo "0x0.st failed, trying catbox.moe"
              URL="$(curl -fsS --max-time 180 -F "reqtype=fileupload" -F "fileToUpload=@${MP4}" https://catbox.moe/user/api.php 2>/dev/null || true)"
            fi
          fi
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          echo "temp video url: ${URL:-<none>}"

      # Upload the final MP4 to the GitHub release as a permanent backup.
      - name: Publish MP4 to GitHub release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MP4="projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4"
          # Ensure the release exists (create if missing)
          gh release view videos-20260922 >/dev/null 2>&1 || \
            gh release create videos-20260922 --title "Rendered Videos" --notes "Rendered analysis videos."
          # Upload (overwrite if the asset already exists)
          ASSET_NAME="${PROJECT_ID}-final.mp4"
          if gh release view videos-20260922 --json assets -q ".assets[].name" | grep -qx "$ASSET_NAME"; then
            gh release delete-asset videos-20260922 "$ASSET_NAME" --yes
          fi
          gh release upload videos-20260922 "$MP4" --clobber
          echo "Uploaded $ASSET_NAME to release videos-20260922"
          # Also publish the thumbnail + metadata JSON alongside the video.
          for f in "projects/${PROJECT_ID}/renders/${PROJECT_ID}-thumbnail.jpg" \
                   "projects/${PROJECT_ID}/renders/metadata.json"; do
            [ -f "$f" ] || continue
            ANAME="${PROJECT_ID}-$(basename "$f")"
            if gh release view videos-20260922 --json assets -q ".assets[].name" | grep -qx "$ANAME"; then
              gh release delete-asset videos-20260922 "$ANAME" --yes
            fi
            gh release upload videos-20260922 "$f" --clobber
            echo "Uploaded $ANAME to release videos-20260922"
          done

      # Upload to YouTube with the AI-generated title, description, tags and
      # thumbnail. Runs only when the YouTube OAuth secrets are configured.
      - name: Upload to YouTube
        if: success() && env.YOUTUBE_REFRESH_TOKEN != ''
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          YT_PRIVACY: ${{ vars.YT_PRIVACY || 'public' }}
        run: |
          set -euo pipefail
          ARGS=(--video "projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4"
                --metadata "projects/${PROJECT_ID}/renders/metadata.json"
                --privacy "${YT_PRIVACY}")
          if [ -f "projects/${PROJECT_ID}/renders/${PROJECT_ID}-thumbnail.jpg" ]; then
            ARGS+=(--thumbnail "projects/${PROJECT_ID}/renders/${PROJECT_ID}-thumbnail.jpg")
          fi
          python3 tools/youtube-upload.py "${ARGS[@]}" | tee "projects/${PROJECT_ID}/renders/youtube-url.txt" \
            || echo "youtube upload failed (non-fatal)"

      # Optional: push the finished asset to Cloudflare R2 (S3 compatible).
      - name: Publish to object storage
        if: ${{ env.R2_BUCKET != '' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          command -v aws >/dev/null || pip install --quiet awscli
          aws s3 cp "projects/${PROJECT_ID}/renders/${PROJECT_ID}-final.mp4" \
            "s3://${R2_BUCKET}/renders/${PROJECT_ID}.mp4" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"

      - name: Report completion
        if: always()
        run: |
          echo "project=${PROJECT_ID} status=${{ job.status }}"

      # Tell the orchestrator worker the render finished (success or failure)
      # so the studio stops showing the project as RENDERING forever. The
      # worker marks the project COMPLETED/FAILED and links the finished MP4.
      - name: Notify orchestrator of completion
        if: always() && env.AVM_HOOK_SECRET != '' && inputs.projectId != ''
        env:
          AVM_HOOK_SECRET: ${{ secrets.AVM_HOOK_SECRET }}
          HOOK_URL: https://avm-orchestrator.${{ vars.CLOUDFLARE_WORKERS_SUBDOMAIN }}.workers.dev/api/hooks/render-complete
        run: |
          set -uo pipefail
          STATUS="failure"
          if [ "${{ job.status }}" = "success" ]; then STATUS="success"; fi
          curl -fsS --max-time 30 -X POST "$HOOK_URL" \
            -H "Content-Type: application/json" \
            -H "x-hook-secret: $AVM_HOOK_SECRET" \
            -d "{\"projectId\": \"${{ inputs.projectId }}\", \"status\": \"$STATUS\", \"runId\": ${{ github.run_id }}, \"assetName\": \"${{ inputs.projectId }}-final.mp4\", \"artifactUrl\": \"${{ steps.temphost.outputs.url }}\"}" \
            && echo "orchestrator notified: $STATUS" \
            || echo "hook notify failed (non-fatal)"