name: research

# Runs the research pipeline on a GitHub runner, using the same AI providers the
# local runs use. The resulting bundle is uploaded as an artifact so it can be
# approved and then rendered by render-video.yml.
#
# Requires repo secrets: NARA_API_KEY, MONID_API_KEY (optional: GEMINI_*, KAGGLE_*).

on:
  workflow_dispatch:
    inputs:
      topic:
        description: Topic to research
        required: true
        default: "World Population by Country 1960-2024"
      projectId:
        description: Studio project id — the bundle is committed to bundles/<projectId>/
        required: false
        default: ""
      autoRender:
        description: "Automatically trigger render-video.yml when research succeeds (1-prompt video)"
        required: false
        default: "true"
      prompt:
        description: Natural-language video request (agent mode). The agent picks the source, years and entities itself.
        required: false
        default: ""
      fromYear:
        description: First year of the time range (e.g. 1960)
        required: false
        default: ""
      toYear:
        description: Last year of the time range (e.g. 2024)
        required: false
        default: ""
      worldBankIndicator:
        description: Optional World Bank indicator id (leave empty for auto-discovery)
        required: false
        default: ""
      topN:
        description: Entities shown in the race
        required: false
        default: "10"
      framesPerTransition:
        description: Frames per period transition
        required: false
        default: "20"
      skipAi:
        description: "true to run without any AI calls"
        required: false
        default: "false"

permissions:
  contents: write
  actions: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
      NARA_BASE_URL: ${{ vars.NARA_BASE_URL || 'https://router.bynara.id/v1' }}
      GEMINI_WORKER_1: ${{ vars.GEMINI_WORKER_1 }}
      GEMINI_WORKER_2: ${{ vars.GEMINI_WORKER_2 }}
      GEMINI_MODELS: ${{ vars.GEMINI_MODELS }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      MONID_API_KEY: ${{ secrets.MONID_API_KEY }}
      KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
      KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      DATARACE_BIN: ${{ github.workspace }}/target/release/datarace
      LOG_LEVEL: info
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - run: npm ci

      - name: Build the Rust core
        run: cargo build --release --workspace

      - name: AI health check (fail fast if no model answers)
        run: |
          set -euo pipefail
          npx tsx services/orchestrator/src/scripts/ai-health.ts \
            || { echo "::error::No AI model is responding — check GEMINI_WORKER_* vars and NARA_API_KEY secret"; exit 1; }

      - name: Run the research pipeline
        env:
          AVM_TOPIC: ${{ inputs.topic }}
          AVM_PROMPT: ${{ inputs.prompt }}
          AVM_TOPN: ${{ inputs.topN }}
          AVM_FRAMES: ${{ inputs.framesPerTransition }}
          AVM_INDICATOR: ${{ inputs.worldBankIndicator }}
          AVM_FROM: ${{ inputs.fromYear }}
          AVM_TO: ${{ inputs.toYear }}
          AVM_SKIP_AI: ${{ inputs.skipAi }}
        run: |
          set -euo pipefail
          ARGS=("$AVM_TOPIC" --topn "$AVM_TOPN" --frames "$AVM_FRAMES")
          if [ -n "$AVM_INDICATOR" ]; then
            ARGS+=(--indicator "$AVM_INDICATOR")
          fi
          if [ -n "$AVM_FROM" ] && [ -n "$AVM_TO" ]; then
            ARGS+=(--from "$AVM_FROM" --to "$AVM_TO")
          fi
          if [ -n "$AVM_PROMPT" ]; then
            ARGS+=(--prompt "$AVM_PROMPT")
          fi
          if [ "$AVM_SKIP_AI" = "true" ]; then
            ARGS+=(--skip-ai)
          fi
          npx tsx services/orchestrator/src/scripts/demo-research.ts "${ARGS[@]}"

      # The runner names the project dir itself (topic + timestamp). When the
      # studio dispatched this run it passed its own project id — rename the
      # bundle to it so the Render tab picks it up without manual juggling.
      - name: Name the bundle after the studio project
        if: ${{ inputs.projectId != '' }}
        env:
          AVM_PROJECT_ID: ${{ inputs.projectId }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          dirs=(projects/*/)
          if [ "${#dirs[@]}" -ne 1 ]; then
            echo "expected exactly one project dir, found ${#dirs[@]}"
            exit 1
          fi
          src="${dirs[0]%/}"
          if [ "$src" != "projects/$AVM_PROJECT_ID" ]; then
            mv "$src" "projects/$AVM_PROJECT_ID"
          fi
          ls "projects/$AVM_PROJECT_ID"

      - name: Validate every produced bundle
        run: |
          set -euo pipefail
          for dir in projects/*/; do
            echo "validating $dir"
            npx tsx tools/validate-spec.ts "$dir"
            ./target/release/datarace validate --in "$dir/dataset.json" --strict --out "$dir/quality.ci.json"
          done

      - name: AI QA review of the bundle
        if: ${{ inputs.skipAi != 'true' }}
        run: |
          set -euo pipefail
          for dir in projects/*/; do
            npx tsx services/orchestrator/src/scripts/ai-qa.ts --project "$dir"
          done

      - name: Upload the research bundle
        uses: actions/upload-artifact@v4
        with:
          name: research-bundle
          path: projects/
          retention-days: 14
          if-no-files-found: error

      # Export a plain dataset.csv into the bundle so the researched data is
      # saved to the repo as a reusable CSV (not just dataset.json).
      - name: Export dataset.csv into the bundle
        if: ${{ inputs.projectId != '' }}
        run: |
          set -euo pipefail
          if [ -f "projects/${{ inputs.projectId }}/dataset.json" ]; then
            python3 tools/export-dataset-csv.py \
              --in "projects/${{ inputs.projectId }}/dataset.json" \
              --out "projects/${{ inputs.projectId }}/dataset.csv" \
              || echo "dataset.csv export failed (non-fatal)"
          fi

      # Commit the bundle into the repo so the studio's Render button works
      # straight after research — no manual download/commit step in between.
      - name: Commit research bundle to the repo
        if: ${{ inputs.projectId != '' }}
        run: |
          set -euo pipefail
          git config user.name "avm-research-bot"
          git config user.email "avm-research-bot@users.noreply.github.com"
          rm -rf "bundles/${{ inputs.projectId }}"
          mkdir -p bundles
          cp -r "projects/${{ inputs.projectId }}" "bundles/${{ inputs.projectId }}"
          git add "bundles/${{ inputs.projectId }}"
          if git diff --cached --quiet; then
            echo "nothing to commit"
          else
            git commit -m "research: bundle for ${{ inputs.projectId }}"
            # Push race resilience: a parallel research run may have pushed its
            # own bundle commit first. Rebase onto the remote tip and retry
            # instead of failing the whole run on a non-fast-forward reject.
            for attempt in 1 2 3; do
              if git push origin "HEAD:${{ github.ref_name }}"; then
                break
              fi
              echo "push attempt $attempt rejected; rebasing onto remote tip and retrying"
              git fetch origin "${{ github.ref_name }}" || true
              git rebase "origin/${{ github.ref_name }}" || git pull --rebase origin "${{ github.ref_name }}"
              sleep 10
              if [ "$attempt" = "3" ]; then
                echo "push still rejected after 3 attempts; giving up"
                exit 1
              fi
            done
          fi

      # One-prompt video: auto-trigger the render when research succeeds.
      # Set inputs.autoRender=false to get research-only behavior.
      - name: Auto-trigger render
        if: ${{ inputs.projectId != '' && inputs.autoRender != 'false' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'render-video.yml',
              ref: context.ref,
              inputs: {
                projectId: '${{ inputs.projectId }}',
                renderScale: '1',
              },
            });
            core.info('Render auto-triggered for ${{ inputs.projectId }}');